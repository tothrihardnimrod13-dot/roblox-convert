name: Convert RBXLX to RBXL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Download Remodel
      run: |
        curl -L -o remodel.zip https://github.com/rojo-rbx/remodel/releases/download/v0.11.0/remodel-v0.11.0-linux-amd64.zip
        unzip remodel.zip
        chmod +x remodel
        
    - name: Run Conversion
      run: ./remodel run convert.lua
      
    - name: Upload Converted File
      uses: actions/upload-artifact@v3
      with:
        name: converted-place
        path: "*.rbxl"
